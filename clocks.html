<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the current time in cities around the world.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>World clocks - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="clocks user-select-none" oncontextmenu="return false">
    <main class="page">
        <a class="btn btn-light back" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>

        <h1><i class="bi bi-globe-americas" aria-hidden="true"></i> World clocks</h1>

        <p class="display" id="time">00:00:00</p>
        <p class="fs-5" id="date"></p>

        <fieldset class="d-flex flex-wrap justify-content-center gap-2" id="cities">
            <legend class="visually-hidden">City</legend>
            <input class="btn-check" type="radio" name="city" id="new-york" value="America/New_York" checked>
            <label class="btn btn-light" for="new-york">New York</label>
            <input class="btn-check" type="radio" name="city" id="london" value="Europe/London">
            <label class="btn btn-light" for="london">London</label>
            <input class="btn-check" type="radio" name="city" id="dubai" value="Asia/Dubai">
            <label class="btn btn-light" for="dubai">Dubai</label>
            <input class="btn-check" type="radio" name="city" id="mumbai" value="Asia/Kolkata">
            <label class="btn btn-light" for="mumbai">Mumbai</label>
            <input class="btn-check" type="radio" name="city" id="tokyo" value="Asia/Tokyo">
            <label class="btn btn-light" for="tokyo">Tokyo</label>
            <input class="btn-check" type="radio" name="city" id="sydney" value="Australia/Sydney">
            <label class="btn btn-light" for="sydney">Sydney</label>
        </fieldset>
    </main>

    <script src="script.js"></script>
</body>

</html>
