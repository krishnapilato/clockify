<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the current time in cities around the world.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>World clocks - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="clocks user-select-none" oncontextmenu="return false" onload="showCity('New York', 'America/New_York')">
    <main class="page">
        <a class="btn btn-light back" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>

        <h1><i class="bi bi-globe-americas" aria-hidden="true"></i> World clocks</h1>

        <p class="fs-4" id="city" role="status"></p>
        <p class="display" id="time">00:00:00</p>
        <p class="fs-5" id="date"></p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button class="btn btn-light" type="button" onclick="showCity('New York', 'America/New_York')">New York</button>
            <button class="btn btn-light" type="button" onclick="showCity('London', 'Europe/London')">London</button>
            <button class="btn btn-light" type="button" onclick="showCity('Dubai', 'Asia/Dubai')">Dubai</button>
            <button class="btn btn-light" type="button" onclick="showCity('Mumbai', 'Asia/Kolkata')">Mumbai</button>
            <button class="btn btn-light" type="button" onclick="showCity('Tokyo', 'Asia/Tokyo')">Tokyo</button>
            <button class="btn btn-light" type="button" onclick="showCity('Sydney', 'Australia/Sydney')">Sydney</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
