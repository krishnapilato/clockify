<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="See the time in any country of the world." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e11" />
    <title>World clocks · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/clocks.ts"></script>
  </head>

  <body>
    <img
      class="photo"
      id="photo"
      src="data:,"
      alt=""
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <header class="topbar">
      <a class="brand" href="index.html">Clockify</a>
      <p class="credit" id="credit"></p>
    </header>

    <main class="page">
      <h1 class="visually-hidden">World clocks</h1>

      <div class="meta">
        <label class="country">
          <span id="country-name"></span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
          <select id="country-picker" aria-label="Country"></select>
        </label>
        <span class="label" id="weekday"></span><span class="dot" aria-hidden="true"></span
        ><span class="label" id="date"></span>
      </div>
      <div class="face">
        <p class="display" id="time" role="timer" aria-label="00:00:00">
          <span class="digits" id="top-digits">00</span>
          <span class="digits accent-digits" id="bottom-digits">00</span>
          <span class="small-digits" id="small-digits">00</span>
        </p>
        <svg class="analog" id="analog" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="analog-face" cx="100" cy="100" r="98" />
          <circle class="ticks" cx="100" cy="100" r="90" pathLength="60" />
          <circle class="ticks hours" cx="100" cy="100" r="90" pathLength="12" />
          <g id="numbers"></g>
          <path class="hour-hand" id="hour-hand" d="M100 108 L96 100 L100 54 L104 100 Z" />
          <path class="minute-hand" id="minute-hand" d="M100 110 L97.5 100 L100 30 L102.5 100 Z" />
          <g class="second-hand" id="second-hand">
            <line x1="100" y1="122" x2="100" y2="24" />
            <circle cx="100" cy="116" r="3" />
          </g>
          <circle class="pin" cx="100" cy="100" r="3.5" />
        </svg>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-bar" id="progress"></span>
      </div>
      <div class="controls">
        <button class="pill" id="style-button" type="button">
          <i class="bi bi-clock" aria-hidden="true"></i>
          <span class="pill-text">Analog</span>
        </button>
      </div>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">
            <i class="bi bi-clock" aria-hidden="true"></i>
            <span>Clock</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html" aria-current="page">
            <i class="bi bi-globe-americas" aria-hidden="true"></i>
            <span>World</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html">
            <i class="bi bi-alarm" aria-hidden="true"></i>
            <span>Alarm</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">
            <i class="bi bi-stopwatch" aria-hidden="true"></i>
            <span>Stopwatch</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <span>Timer</span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
