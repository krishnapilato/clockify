<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="See the current time in cities around the world.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <meta name="theme-color" content="#141311">
    <title>World clocks - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Outfit:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body class="user-select-none" data-page="clocks" data-photo="clock tower" oncontextmenu="return false">
    <img class="photo" id="photo" alt="">

    <main class="page">
        <h1 class="visually-hidden">World clocks</h1>

        <div class="dial">
            <svg viewBox="0 0 200 200" aria-hidden="true">
                <circle class="face" cx="100" cy="100" r="100" />
                <circle class="ticks" cx="100" cy="100" r="88" pathLength="60" />
                <circle class="ticks hours" cx="100" cy="100" r="88" pathLength="12" />
                <circle class="ring" id="ring" cx="100" cy="100" r="95" pathLength="100" transform="rotate(-90 100 100)" />
                <g class="analog" id="analog">
                    <g id="numbers"></g>
                    <path class="hour-hand" id="hour-hand" d="M100 108 L96 100 L100 54 L104 100 Z" />
                    <path class="minute-hand" id="minute-hand" d="M100 110 L97.5 100 L100 30 L102.5 100 Z" />
                    <g class="second-hand" id="second-hand">
                        <line x1="100" y1="122" x2="100" y2="24" />
                        <circle cx="100" cy="116" r="3" />
                    </g>
                    <circle class="pin" cx="100" cy="100" r="3.5" />
                </g>
            </svg>
            <div class="dial-text">
                <label class="country dial-top">
                    <span id="country-name"></span>
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    <select id="country-picker" aria-label="Country"></select>
                </label>
                <p class="display" id="time">00:00:00</p>
                <div class="dial-bottom">
                    <p class="label"><span id="weekday"></span> <span id="date"></span></p>
                </div>
            </div>
            <button class="round-button dial-right" id="style-button" type="button" data-action="switchStyle" aria-label="Show the analog clock" title="Show the analog clock">
                <i class="bi bi-clock" aria-hidden="true"></i>
            </button>
        </div>
    </main>

    <p class="credit" id="credit"></p>

    <nav class="corner-menu" id="corner-menu" aria-label="Pages">
        <button class="round-button corner-menu-button" id="corner-menu-button" type="button" aria-label="Open the menu" title="Menu" aria-expanded="false" aria-controls="corner-menu-links">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <ul class="corner-menu-links" id="corner-menu-links">
            <li><a class="round-button corner-menu-link" href="index.html" aria-label="Clock" title="Clock"><i class="bi bi-clock" aria-hidden="true"></i></a></li>
            <li><a class="round-button corner-menu-link" href="clocks.html" aria-label="World clocks" title="World clocks" aria-current="page"><i class="bi bi-globe-americas" aria-hidden="true"></i></a></li>
            <li><a class="round-button corner-menu-link" href="alarm.html" aria-label="Alarm" title="Alarm"><i class="bi bi-alarm" aria-hidden="true"></i></a></li>
            <li><a class="round-button corner-menu-link" href="stopwatch.html" aria-label="Stopwatch" title="Stopwatch"><i class="bi bi-stopwatch" aria-hidden="true"></i></a></li>
            <li><a class="round-button corner-menu-link" href="countdown.html" aria-label="Countdown" title="Countdown"><i class="bi bi-hourglass-split" aria-hidden="true"></i></a></li>
        </ul>
    </nav>
</body>

</html>
