<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="See the time in any country of the world." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef0f2" />
    <title>World clocks · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/vendor.css" />
    <link rel="stylesheet" href="/src/styles/main.scss" />
    <script type="module" src="/src/pages/clocks.ts"></script>
  </head>

  <body>
    <button class="corner-action" id="fullscreen-button" type="button" aria-pressed="false" hidden>
      Full screen
    </button>
    <main class="page">
      <h1 class="visually-hidden">World clocks</h1>

      <div class="meta">
        <label class="country">
          <span class="visually-hidden">Country</span>
          <select id="country-picker"></select>
        </label>
        <span class="label" id="weekday"></span><span class="dot" aria-hidden="true"></span
        ><span class="label" id="date"></span>
      </div>
      <div class="face">
        <p class="display" id="time" role="timer" aria-label="00:00:00">
          <span class="digits" id="top-digits">00</span>
          <span class="digits accent-digits" id="bottom-digits">00</span>
          <span class="small-digits" id="small-digits">00</span>
        </p>
        <svg class="analog" id="analog" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d9bf8c" />
              <stop offset="0.45" stop-color="#8c6d3f" />
              <stop offset="0.7" stop-color="#c9a96e" />
              <stop offset="1" stop-color="#6f5530" />
            </linearGradient>
            <radialGradient id="dial" cx="0.5" cy="0.42" r="0.6">
              <stop offset="0" stop-color="#fdfbf6" />
              <stop offset="1" stop-color="#ece4d4" />
            </radialGradient>
          </defs>
          <circle class="bezel" cx="100" cy="100" r="97" />
          <circle class="dial" cx="100" cy="100" r="94" />
          <circle class="chapter" cx="100" cy="100" r="89" />
          <circle class="chapter" cx="100" cy="100" r="83" />
          <circle class="minutes" cx="100" cy="100" r="86" pathLength="60" />
          <circle class="batons" cx="100" cy="100" r="76" pathLength="12" />
          <g id="numbers"></g>
          <text class="signature" x="100" y="134">Clockify</text>
          <g class="hour-hand" id="hour-hand">
            <path class="facet" d="M100 50 L95.4 93 L100 109 Z" />
            <path class="facet-light" d="M100 50 L104.6 93 L100 109 Z" />
          </g>
          <g class="minute-hand" id="minute-hand">
            <path class="facet" d="M100 22 L96.6 92 L100 111 Z" />
            <path class="facet-light" d="M100 22 L103.4 92 L100 111 Z" />
          </g>
          <g class="second-hand" id="second-hand">
            <line x1="100" y1="128" x2="100" y2="18" />
            <circle cx="100" cy="120" r="3.4" />
          </g>
          <circle class="cap" cx="100" cy="100" r="4.6" />
          <circle class="cap-dot" cx="100" cy="100" r="1.5" />
        </svg>
      </div>
      <p class="local-time label" id="local-time"></p>
      <div class="controls">
        <button class="pill" id="style-button" type="button">
          <span class="pill-text" id="style-label">Analog</span>
        </button>
      </div>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">Clock</a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html" aria-current="page">World</a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html">Alarm</a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">Stopwatch</a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html">Timer</a>
        </li>
      </ul>
    </nav>
  </body>
</html>
