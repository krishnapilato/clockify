<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set an alarm for any date and time.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>Alarm - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="alarm user-select-none" oncontextmenu="return false">
    <main class="page">
        <a class="btn btn-light back" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>

        <h1><i class="bi bi-alarm" aria-hidden="true"></i> Alarm</h1>

        <p class="display" id="time" role="timer">00:00:00</p>

        <form class="d-flex flex-column align-items-center gap-3" id="form" novalidate>
            <label class="fs-5" for="alarm-time">Ring at</label>
            <input class="form-control form-control-lg" id="alarm-time" type="datetime-local">
            <button class="btn btn-primary" id="start" type="submit">
                <i class="bi bi-bell" aria-hidden="true"></i> Set alarm
            </button>
        </form>

        <p class="fs-5" id="status" role="status"></p>

        <audio id="sound" src="alarm.mp3" preload="auto" loop></audio>
    </main>

    <script src="script.js"></script>
</body>

</html>
