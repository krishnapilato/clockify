<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Set an alarm with your favourite ringtone." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e11" />
    <title>Alarm · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/alarm.ts"></script>
  </head>

  <body>
    <img
      class="photo"
      id="photo"
      src="data:,"
      alt=""
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <header class="topbar">
      <a class="brand" href="index.html">Clockify</a>
      <p class="credit" id="credit"></p>
    </header>

    <main class="page">
      <h1 class="visually-hidden">Alarm</h1>

      <div class="meta"><span class="label">Time left</span></div>
      <div class="face">
        <p class="display" id="time" role="timer" aria-label="00:00:00">
          <span class="digits" id="top-digits">00</span>
          <span class="digits accent-digits" id="bottom-digits">00</span>
          <span class="small-digits" id="small-digits">00</span>
        </p>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-bar" id="progress"></span>
      </div>
      <div class="fields">
        <label class="field">
          <span class="label">Ring at</span>
          <input class="field-control" id="alarm-time" type="datetime-local" />
        </label>
        <label class="field">
          <span class="label">Ringtone</span>
          <select class="field-control" id="ringtone">
            <option value="sounds/classic.mp3">Classic</option>
            <option value="sounds/chime.wav">Chime</option>
            <option value="sounds/bells.wav">Bells</option>
            <option value="sounds/digital.wav">Digital</option>
            <option value="sounds/pulse.wav">Pulse</option>
            <option value="sounds/sunrise.wav">Sunrise</option>
          </select>
        </label>
      </div>
      <div class="controls">
        <button class="pill" id="stop-button" type="button">
          <i class="bi bi-bell-slash" aria-hidden="true"></i>
          <span class="pill-text">Stop</span>
        </button>
        <button class="pill main" id="set-button" type="button">
          <i class="bi bi-bell" aria-hidden="true"></i>
          <span class="pill-text">Set alarm</span>
        </button>
        <button class="pill" id="listen-button" type="button">
          <i class="bi bi-volume-up" aria-hidden="true"></i>
          <span class="pill-text">Listen</span>
        </button>
      </div>
      <p class="status" id="status" role="status"></p>
      <audio id="sound" loop></audio>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">
            <i class="bi bi-clock" aria-hidden="true"></i>
            <span>Clock</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html">
            <i class="bi bi-globe-americas" aria-hidden="true"></i>
            <span>World</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html" aria-current="page">
            <i class="bi bi-alarm" aria-hidden="true"></i>
            <span>Alarm</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">
            <i class="bi bi-stopwatch" aria-hidden="true"></i>
            <span>Stopwatch</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <span>Timer</span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
