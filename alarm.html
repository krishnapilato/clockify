<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Set an alarm with your favourite ringtone." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef0f2" />
    <title>Alarm · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/vendor.css" />
    <link rel="stylesheet" href="/src/styles/main.scss" />
    <script type="module" src="/src/pages/alarm.ts"></script>
  </head>

  <body>
    <button class="corner-action" id="fullscreen-button" type="button" aria-pressed="false" hidden>
      Full screen
    </button>
    <main class="page">
      <h1 class="visually-hidden">Alarm</h1>

      <div class="meta"><span class="label">Time left</span></div>
      <div class="face">
        <p class="display" id="time" role="timer" aria-label="00:00:00">
          <span class="digits" id="top-digits">00</span>
          <span class="digits accent-digits" id="bottom-digits">00</span>
          <span class="small-digits" id="small-digits">00</span>
        </p>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-bar" id="progress"></span>
      </div>
      <div class="fields">
        <div class="field">
          <span class="label" id="ring-at">Ring at</span>
          <div class="clock-field" role="group" aria-labelledby="ring-at">
            <input
              class="clock-input"
              id="alarm-hours"
              type="text"
              inputmode="numeric"
              maxlength="2"
              autocomplete="off"
              aria-label="Hours"
            />
            <span class="clock-colon" aria-hidden="true">:</span>
            <input
              class="clock-input"
              id="alarm-minutes"
              type="text"
              inputmode="numeric"
              maxlength="2"
              autocomplete="off"
              aria-label="Minutes"
            />
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="pill" id="stop-button" type="button" hidden>
          <i class="bi bi-bell-slash" aria-hidden="true"></i>
          <span class="pill-text">Stop</span>
        </button>
        <button class="pill main" id="set-button" type="button">
          <i class="bi bi-bell" aria-hidden="true"></i>
          <span class="pill-text">Set alarm</span>
        </button>
      </div>
      <p class="status" id="status" role="status"></p>
      <audio id="sound" src="sounds/chime.wav" preload="none" loop></audio>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">Clock</a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html">World</a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html" aria-current="page">Alarm</a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">Stopwatch</a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html">Timer</a>
        </li>
      </ul>
    </nav>
  </body>
</html>
