<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clockify - Alarm</title>
    <link rel="shortcut icon" href="http://cdn.onlinewebfonts.com/svg/img_461716.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            font-family: 'Open Sans', sans-serif;
        }

        .panel {
            background: rgba(17, 24, 39, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center text-white px-4 py-8">
    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold">Clockify</h1>
        <p class="text-lg mt-2">Set Your Alarm with Ease</p>
    </header>

    <main class="w-full max-w-xl text-center panel p-6 md:p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold mb-4">Set Your Alarm</h2>
            <input 
                id="alarmTime" 
                type="datetime-local" 
                class="w-full p-3 text-black rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-400" 
                required
            >
            <div id="countdown" class="mt-4 text-xl hidden" aria-live="polite">Alarm will ring in: <span id="time-left" class="font-semibold"></span></div>
            <p id="alarm-status" class="mt-3 text-sm text-gray-200" aria-live="polite"></p>
        </div>

        <div class="flex justify-center gap-4">
            <button 
                id="alarmButton" 
                class="px-6 py-3 bg-green-500 text-white rounded-lg shadow hover:bg-green-600 focus:outline-none">
                Start Alarm
            </button>
            <button 
                id="cancelButton" 
                class="px-6 py-3 bg-red-500 text-white rounded-lg shadow hover:bg-red-600 hidden focus:outline-none">
                Cancel Alarm
            </button>
        </div>
    </main>

    <footer class="mt-10 flex flex-wrap justify-center gap-4">
        <a href="alarm.html" class="px-6 py-3 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600">Alarm</a>
        <a href="clocks.html" class="px-6 py-3 bg-gray-100 text-gray-800 rounded-lg shadow hover:bg-gray-200">Clocks</a>
        <a href="index.html" class="px-6 py-3 bg-gray-100 text-gray-800 rounded-lg shadow hover:bg-gray-200">Home</a>
        <a href="stopwatch.html" class="px-6 py-3 bg-gray-100 text-gray-800 rounded-lg shadow hover:bg-gray-200">Stopwatch</a>
        <a href="countdown.html" class="px-6 py-3 bg-gray-100 text-gray-800 rounded-lg shadow hover:bg-gray-200">Countdown</a>
    </footer>

    <script>
        const alarmButton = document.getElementById('alarmButton');
        const cancelButton = document.getElementById('cancelButton');
        const countdown = document.getElementById('countdown');
        const timeLeft = document.getElementById('time-left');
        const alarmStatus = document.getElementById('alarm-status');
        const alarmInput = document.getElementById('alarmTime');
        const alarmSound = new Audio('alarm.mp3');
        alarmSound.loop = true;
        let canPlaySound = true;
        alarmSound.addEventListener('error', () => {
            canPlaySound = false;
        });

        let countdownInterval = null;
        let targetAlarmTime = null;
        let minTimeUpdateInterval = null;

        function toDateTimeLocalValue(date) {
            // Convert Date to local datetime-local format by shifting UTC ISO time
            // with getTimezoneOffset (minutes -> milliseconds), then trimming seconds.
            const timezoneOffset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - timezoneOffset).toISOString().slice(0, 16);
        }

        function updateMinTime() {
            alarmInput.min = toDateTimeLocalValue(new Date());
        }

        function setControlsForActiveAlarm(isActive) {
            alarmButton.classList.toggle('hidden', isActive);
            cancelButton.classList.toggle('hidden', !isActive);
        }

        alarmButton.addEventListener('click', () => {
            const alarmTime = alarmInput.valueAsNumber;
            if (isNaN(alarmTime)) {
                alert('Please set a valid time.');
                return;
            }

            const currentTime = Date.now();
            const timeDifference = alarmTime - currentTime;

            if (timeDifference <= 0) {
                alert('The specified time has already passed!');
                return;
            }

            targetAlarmTime = alarmTime;
            alarmStatus.textContent = 'Alarm is active.';
            cancelButton.textContent = 'Cancel Alarm';
            startCountdown();
            setControlsForActiveAlarm(true);
        });

        cancelButton.addEventListener('click', () => {
            clearInterval(countdownInterval);
            countdownInterval = null;
            targetAlarmTime = null;
            countdown.classList.add('hidden');
            alarmSound.pause();
            alarmSound.currentTime = 0;
            alarmStatus.textContent = 'Alarm cancelled.';
            cancelButton.textContent = 'Cancel Alarm';
            setControlsForActiveAlarm(false);
        });

        function startCountdown() {
            countdown.classList.remove('hidden');
            clearInterval(countdownInterval);

            const updateCountdown = () => {
                const remainingTime = Math.max(0, Math.floor((targetAlarmTime - Date.now()) / 1000));
                const hours = Math.floor(remainingTime / 3600);
                const minutes = Math.floor((remainingTime % 3600) / 60);
                const seconds = remainingTime % 60;

                timeLeft.textContent = `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

                if (remainingTime <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    triggerAlarm();
                }
            };

            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        function triggerAlarm() {
            alert('Alarm ringing!');
            if (canPlaySound) {
                alarmSound.play().catch(() => {});
            } else {
                alarmStatus.textContent = 'Alarm time reached (sound unavailable).';
            }
            countdown.classList.add('hidden');
            if (canPlaySound) {
                alarmStatus.textContent = 'Alarm is ringing. Click "Stop Alarm" to stop sound.';
            }
            cancelButton.textContent = 'Stop Alarm';
            setControlsForActiveAlarm(true);
        }

        updateMinTime();
        alarmInput.addEventListener('focus', updateMinTime);
        minTimeUpdateInterval = setInterval(updateMinTime, 1000);
        window.addEventListener('beforeunload', () => {
            clearInterval(minTimeUpdateInterval);
        });
    </script>
</body>

</html>
