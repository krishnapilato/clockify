<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Count down from any number of minutes and seconds.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>Countdown - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="countdown user-select-none" oncontextmenu="return false">
    <main class="page">
        <a class="btn btn-light back" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>

        <h1><i class="bi bi-hourglass-split" aria-hidden="true"></i> Countdown</h1>

        <p class="display" id="time" role="timer">00:02:00</p>

        <div class="d-flex justify-content-center gap-3">
            <div>
                <label class="form-label" for="minutes">Minutes</label>
                <input class="form-control form-control-lg text-center" id="minutes" type="number" min="0" max="999" value="2" oninput="resetCountdown()">
            </div>
            <div>
                <label class="form-label" for="seconds">Seconds</label>
                <input class="form-control form-control-lg text-center" id="seconds" type="number" min="0" max="59" value="0" oninput="resetCountdown()">
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button class="btn btn-primary" type="button" onclick="startCountdown()">
                <i class="bi bi-play-fill" aria-hidden="true"></i> Start
            </button>
            <button class="btn btn-light" type="button" onclick="stopCountdown()">
                <i class="bi bi-pause-fill" aria-hidden="true"></i> Stop
            </button>
            <button class="btn btn-light" type="button" onclick="resetCountdown()">
                <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset
            </button>
        </div>

        <p class="fs-5" id="status" role="status"></p>

        <audio id="sound" src="alarm.mp3"></audio>
    </main>

    <script src="script.js"></script>
</body>

</html>
