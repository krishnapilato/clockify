<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Count down from any number of minutes and seconds." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef0f2" />
    <title>Countdown · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/vendor.css" />
    <link rel="stylesheet" href="/src/styles/main.scss" />
    <script type="module" src="/src/pages/countdown.ts"></script>
  </head>

  <body>
    <button class="corner-action" id="fullscreen-button" type="button" aria-pressed="false" hidden>
      Full screen
    </button>
    <main class="page">
      <h1 class="visually-hidden">Countdown</h1>

      <div class="meta"><span class="label">Tap the numbers to change them</span></div>
      <div class="face">
        <p class="display" role="timer">
          <input
            class="digits time-input"
            id="minutes"
            type="text"
            inputmode="numeric"
            maxlength="2"
            autocomplete="off"
            value="02"
            aria-label="Minutes"
          />
          <input
            class="digits time-input"
            id="seconds"
            type="text"
            inputmode="numeric"
            maxlength="2"
            autocomplete="off"
            value="00"
            aria-label="Seconds"
          />
        </p>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-bar" id="progress"></span>
      </div>
      <div class="controls">
        <button class="pill" id="reset-button" type="button">
          <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
          <span class="pill-text">Reset</span>
        </button>
        <button class="pill main" id="play-button" type="button">
          <i class="bi bi-play-fill" aria-hidden="true"></i>
          <span class="pill-text">Start</span>
        </button>
        <button class="pill" id="minute-button" type="button">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>
          <span class="pill-text">1 min</span>
        </button>
      </div>
      <audio id="sound" src="sounds/chime.wav" preload="none"></audio>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">Clock</a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html">World</a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html">Alarm</a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">Stopwatch</a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html" aria-current="page">Timer</a>
        </li>
      </ul>
    </nav>
  </body>
</html>
