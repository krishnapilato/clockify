<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Count down from any number of minutes and seconds." />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e11" />
    <title>Countdown · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/countdown.ts"></script>
  </head>

  <body>
    <img
      class="photo"
      id="photo"
      src="data:,"
      alt=""
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <header class="topbar">
      <a class="brand" href="index.html">Clockify</a>
      <p class="credit" id="credit"></p>
    </header>

    <main class="page">
      <h1 class="visually-hidden">Countdown</h1>

      <div class="meta"><span class="label">Tap the numbers to change them</span></div>
      <div class="face">
        <p class="display" role="timer">
          <input
            class="digits time-input"
            id="minutes"
            type="text"
            inputmode="numeric"
            maxlength="2"
            autocomplete="off"
            value="02"
            aria-label="Minutes"
          />
          <input
            class="digits time-input"
            id="seconds"
            type="text"
            inputmode="numeric"
            maxlength="2"
            autocomplete="off"
            value="00"
            aria-label="Seconds"
          />
        </p>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-bar" id="progress"></span>
      </div>
      <div class="controls">
        <button class="pill" id="reset-button" type="button">
          <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
          <span class="pill-text">Reset</span>
        </button>
        <button class="pill main" id="play-button" type="button">
          <i class="bi bi-play-fill" aria-hidden="true"></i>
          <span class="pill-text">Start</span>
        </button>
        <button class="pill" id="minute-button" type="button">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>
          <span class="pill-text">1 min</span>
        </button>
      </div>
      <audio id="sound"></audio>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">
            <i class="bi bi-clock" aria-hidden="true"></i>
            <span>Clock</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html">
            <i class="bi bi-globe-americas" aria-hidden="true"></i>
            <span>World</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html">
            <i class="bi bi-alarm" aria-hidden="true"></i>
            <span>Alarm</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html">
            <i class="bi bi-stopwatch" aria-hidden="true"></i>
            <span>Stopwatch</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html" aria-current="page">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <span>Timer</span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
