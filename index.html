<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clockify is a simple clock with world clocks, an alarm, a stopwatch and a countdown.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="user-select-none home" oncontextmenu="return false" onload="startHome()">
    <main class="page">
        <h1><img src="icon.svg" alt="" width="40" height="40"> Clockify</h1>

        <p class="display" id="time">00:00:00</p>
        <svg class="clock d-none" id="analog" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="96" />
            <text class="small-number" x="136" y="38">1</text>
            <text class="small-number" x="162" y="64">2</text>
            <text x="172" y="100">3</text>
            <text class="small-number" x="162" y="136">4</text>
            <text class="small-number" x="136" y="162">5</text>
            <text x="100" y="172">6</text>
            <text class="small-number" x="64" y="162">7</text>
            <text class="small-number" x="38" y="136">8</text>
            <text x="28" y="100">9</text>
            <text class="small-number" x="38" y="64">10</text>
            <text class="small-number" x="64" y="38">11</text>
            <text x="100" y="28">12</text>
            <line class="hand" id="hour-hand" x1="100" y1="100" x2="100" y2="60" />
            <line class="hand" id="minute-hand" x1="100" y1="100" x2="100" y2="42" />
            <line class="hand" id="second-hand" x1="100" y1="116" x2="100" y2="38" />
        </svg>
        <p class="fs-5" id="date"></p>

        <button class="btn btn-light" type="button" onclick="switchStyle()">
            <i class="bi bi-arrow-repeat" aria-hidden="true"></i> Switch style
        </button>

        <ul class="row row-cols-2 row-cols-md-4 g-3 w-100 mb-0 list-unstyled">
            <li class="col">
                <a class="tile clocks" href="clocks.html"><i class="bi bi-globe-americas" aria-hidden="true"></i> World clocks</a>
            </li>
            <li class="col">
                <a class="tile alarm" href="alarm.html"><i class="bi bi-alarm" aria-hidden="true"></i> Alarm</a>
            </li>
            <li class="col">
                <a class="tile stopwatch" href="stopwatch.html"><i class="bi bi-stopwatch" aria-hidden="true"></i> Stopwatch</a>
            </li>
            <li class="col">
                <a class="tile countdown" href="countdown.html"><i class="bi bi-hourglass-split" aria-hidden="true"></i> Countdown</a>
            </li>
        </ul>

        <p class="small">Made by Khova Krishna Pilato and Pasquale Marciano in Sept 2021</p>
    </main>

    <script src="script.js"></script>
</body>

</html>
