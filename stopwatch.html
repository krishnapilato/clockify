<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Measure time and save laps with the stopwatch.">
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano">
    <title>Stopwatch - Clockify</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="stopwatch user-select-none" oncontextmenu="return false">
    <main class="page">
        <a class="btn btn-light back" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>

        <h1><i class="bi bi-stopwatch" aria-hidden="true"></i> Stopwatch</h1>

        <p class="display" id="time" role="timer">00:00:00.00</p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button class="btn btn-primary" type="button" onclick="startStopwatch()">
                <i class="bi bi-play-fill" aria-hidden="true"></i> Start
            </button>
            <button class="btn btn-light" type="button" onclick="stopStopwatch()">
                <i class="bi bi-pause-fill" aria-hidden="true"></i> Stop
            </button>
            <button class="btn btn-light" type="button" onclick="addLap()">
                <i class="bi bi-flag" aria-hidden="true"></i> Lap
            </button>
            <button class="btn btn-light" type="button" onclick="resetStopwatch()">
                <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset
            </button>
        </div>

        <ul class="list-group col-10 col-sm-6" id="laps" aria-label="Laps" aria-live="polite"></ul>
    </main>

    <script src="script.js"></script>
</body>

</html>
