<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Time anything to the thousandth of a second and save your laps."
    />
    <meta name="author" content="Khova Krishna Pilato, Pasquale Marciano" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e11" />
    <title>Stopwatch · Clockify</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/stopwatch.ts"></script>
  </head>

  <body>
    <img
      class="photo"
      id="photo"
      src="data:,"
      alt=""
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <header class="topbar">
      <a class="brand" href="index.html">Clockify</a>
      <p class="credit" id="credit"></p>
    </header>

    <main class="page">
      <h1 class="visually-hidden">Stopwatch</h1>
      <div class="stage">
        <div class="meta"><span class="label">Minutes · seconds</span></div>
        <div class="face">
          <p class="display" id="time" role="timer" aria-label="00:00:00">
            <span class="digits" id="top-digits">00</span>
            <span class="digits accent-digits" id="bottom-digits">00</span>
            <span class="small-digits" id="small-digits">.000</span>
          </p>
        </div>
        <div class="progress" aria-hidden="true">
          <span class="progress-bar" id="progress"></span>
        </div>
        <div class="controls">
          <button class="pill" id="reset-button" type="button">
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
            <span class="pill-text">Reset</span>
          </button>
          <button class="pill main" id="play-button" type="button">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
            <span class="pill-text">Start</span>
          </button>
          <button class="pill" id="lap-button" type="button">
            <i class="bi bi-flag" aria-hidden="true"></i>
            <span class="pill-text">Lap</span>
          </button>
        </div>
      </div>
      <ol class="laps" id="laps" aria-label="Laps" aria-live="polite"></ol>
    </main>

    <nav class="dock" aria-label="Pages">
      <ul class="dock-links">
        <li>
          <a class="dock-link" href="index.html">
            <i class="bi bi-clock" aria-hidden="true"></i>
            <span>Clock</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="clocks.html">
            <i class="bi bi-globe-americas" aria-hidden="true"></i>
            <span>World</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="alarm.html">
            <i class="bi bi-alarm" aria-hidden="true"></i>
            <span>Alarm</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="stopwatch.html" aria-current="page">
            <i class="bi bi-stopwatch" aria-hidden="true"></i>
            <span>Stopwatch</span>
          </a>
        </li>
        <li>
          <a class="dock-link" href="countdown.html">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <span>Timer</span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
